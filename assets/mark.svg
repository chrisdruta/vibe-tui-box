  <style>
    .box { stroke: #7aa2f7; }
    @media (prefers-color-scheme: light) {
      .box { stroke: #3d59a1; }
    }
  </style>

  <!-- wire handle -->
  <path class="box" d="M 30 25 Q 48 7 66 25" fill="none" stroke-width="5" stroke-linecap="round"/>
  <!-- lid band -->
  <path class="box" d="M 20 26 L 76 26 L 73 35 L 23 35 Z" fill="none" stroke-width="5" stroke-linejoin="round"/>
  <!-- body -->
  <path class="box" d="M 23 35 L 73 35 L 66 82 L 30 82 Z" fill="none" stroke-width="5" stroke-linejoin="round"/>

  <!-- panel: split geometry only — no text, survives small sizes -->
  <rect x="33" y="41" width="30" height="24" rx="2.5" fill="#141d33" stroke="#7aa2f7" stroke-width="2.5"/>
  <line x1="41" y1="41" x2="41" y2="60" stroke="#7aa2f7" stroke-width="2"/>
  <line x1="33" y1="60" x2="63" y2="60" stroke="#7aa2f7" stroke-width="2"/>
