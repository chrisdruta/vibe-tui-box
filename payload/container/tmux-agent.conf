# Inner agent-session server conf (docs/architecture.md (agent sessions)).
# Loaded by agent-session.sh with -f: this server is an engine
# (persistence + scrollback), not a UI — the host tmux draws all
# chrome. The prefix stays tmux's default C-b: no collision with the
# host's C-Space, and a plain terminal can still drive the session.

# No inner status bar — under `vibe tui` the host already draws tabs.
set -g status off

# The state channel carrier (slice 2): the inner server re-emits its
# titles string as an OSC title through the docker-exec TTY, where the
# host server sees it as a pane-title change.
set -g set-titles on

# Agent TUIs use passthrough sequences (images, notifications).
set -g allow-passthrough on

# Wheel scroll for the agent TUIs. With mouse off here, this server's
# client never requests mouse reporting from the host pane, so the HOST
# tmux swallows the wheel into alternate-screen arrow emulation and the
# agent CLI shows its "add 'set -g mouse on'" hint. On, wheel events
# flow through to the conversation transcript.
set -g mouse on

# Same chain-parity rule for the input features the host server already
# enables (tmux-tui.conf): each one is requested from the host pane
# only when THIS server wants it, so an inner server without them cuts
# the feature at the second layer — focus tracking (the agent CLI's
# "focus-events off" hint) and extended keys (shift+enter reaching the
# agent as a keystroke, not a newline-less enter).
set -s focus-events on
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Don't make the agent's escape key laggy.
set -s escape-time 10
