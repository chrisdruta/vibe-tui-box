# vibe tui — the HOST-side tmux conf, ported from the v1 harness.
#
# Shipped in the engine payload (content-addressed, host-readable) and
# materialized by `vibe tui` into engine state with a stamped prologue:
# @vibe_exe (absolute engine binary) and VIBE_TUI_CONF (this file's
# materialized path, for prefix+R reload). Loaded with -f on a dedicated
# socket (tmux -L vibe-engine) so it never touches a personal
# ~/.tmux.conf or the default server. Conf applies at server start;
# passing -f on later calls is harmless.
#
# Requires tmux >= 3.4 (styles containing formats, user mouse ranges).
# status-format[0] below is the stock 3.7 format plus one range=user
# cell; regenerate against `tmux show -g status-format` on a tmux bump.
#
# Host scripts (sidebar, dock, clip) live beside this conf in the
# payload at scripts/, reached through the stamped @vibe_payload_dir —
# the v2 successor of v1's @vibe_harness_dir rule: the host executes
# only store-owned bytes, never workspace files.
#
# The state-render.sh pane-title channel feeds the per-window
# @vibe_glyph/@vibe_dot_fg/@vibe_attn conditionals in the formats below
# (docs/architecture.md (agent sessions)); engine state lives in status-right via
# `vibe _state`.

# ── theme ────────────────────────────────────────────────────────────────
# Navy/periwinkle with a coral accent. User options so every style below
# reads one palette. tmux can't nest #{@thm_x} inside a #[...] inside a
# #{?...}, so the two window-status formats re-inline these hexes —
# change a color in both places or the tabs drift.
set -g @thm_bg      "#0e1421"
set -g @thm_surface "#1a2440"
set -g @thm_border  "#2a3554"
set -g @thm_fg      "#a9b6d8"
set -g @thm_dim     "#5c6b96"
set -g @thm_blue    "#7aa2f7"
set -g @thm_accent  "#3d59a1"
set -g @thm_coral   "#e8735a"
set -g @thm_green   "#9ece6a"
set -g @thm_yellow  "#e0af68"
set -g @thm_red     "#f7768e"

# ── prefix / session behavior ────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix
bind C-a send-prefix -2
set -g default-command "${SHELL}"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g allow-rename off
set -g detach-on-destroy on

# ── terminal plumbing ────────────────────────────────────────────────────
set -s  default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -s  extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -s  escape-time 10
set -s  focus-events on
set -g  history-limit 50000
set -g  mouse on
set -s  set-clipboard on
set -g  allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# Everything under this server is the nested UI: panes inherit the
# marker, `vibe agent` forwards it into the container, and the inner
# tmux clients it stamps become reapable when the UI dies
# (agent-session.sh reap, run by `vibe tui` after a quit).
set-environment -g VIBE_NESTED 1
set -as terminal-features ",xterm*:title"
set -g  set-titles on
set -g  set-titles-string "🥡 #S"

# ── status bar ───────────────────────────────────────────────────────────
# interval 5 (v1 used 0): engine state now polls through #(vibe _state)
# in status-right, stamped per session by `vibe tui`.
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-left-length 48
set -g status-right-length 60
set -g window-status-separator " "
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-left " 🥡 #[fg=#{@thm_fg},bold]#S #[fg=#{@thm_border}]│ #[fg=#{@thm_dim}]windows:#[default] "
setw -g window-status-format "#{?#{@vibe_attn},#[fg=#{@thm_bg}#,bg=#{@thm_coral}#,bold],#[fg=#{@thm_dim}#,bg=#{@thm_surface}]}  #{?#{@vibe_glyph},#[fg=#{@vibe_dot_fg}]#{@vibe_glyph}#{?#{@vibe_attn},#[fg=#{@thm_bg}],#[fg=#{@thm_dim}]} ,}#I·#W  "
setw -g window-status-current-format "#{?#{@vibe_attn},#[fg=#{@thm_bg}#,bg=#{@thm_coral}#,bold],#[fg=#ffffff#,bg=#{@thm_accent}#,bold]}  #{?#{@vibe_glyph},#[fg=#{@vibe_dot_fg}]#{@vibe_glyph}#{?#{@vibe_attn},#[fg=#{@thm_bg}],#[fg=#ffffff]} ,}#I·#W  "
setw -g window-status-bell-style "fg=#{@thm_bg},bg=#{@thm_coral},bold"

# Stock 3.7 status-format[0] with one insertion: a clickable
# range=user|newwin "+" cell between the window list and the right side.
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[range=user|newwin]#[fg=#{@thm_dim},bg=#{@thm_surface}] + #[norange default]#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# status-right is stamped per session by `vibe tui`: the v1 prefix/copy
# indicators plus #(vibe _state) and the project display name.

# ── pane borders ─────────────────────────────────────────────────────────
setw -g pane-border-status top
setw -g pane-border-lines single
setw -g pane-border-style "fg=#{@thm_border}"
setw -g pane-active-border-style "fg=#{@thm_blue}"
setw -g pane-border-format "#[fg=#{@thm_border}]─#[default] #{?#{||:#{==:#{@vibe_role},agent},#{==:#{@vibe_role},}},#{?#{@vibe_glyph},#{?#{@vibe_attn},#[fg=#{@thm_coral}],#[fg=#{@vibe_dot_fg}]}#{@vibe_glyph}#[default] ,},}#{?pane_active,#[fg=#{@thm_blue}#,bold],#[fg=#{@thm_dim}]}#{?#{@vibe_title},#{@vibe_title},#{pane_title}}#[default] #[fg=#{@thm_border}]"

# ── popups / menus / messages ────────────────────────────────────────────
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@thm_blue}"
set -g menu-border-lines rounded
set -g menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g menu-selected-style "bg=#{@thm_accent},fg=#ffffff,bold"
set -g message-style "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_surface},fg=#{@thm_yellow}"
set -g mode-style "bg=#{@thm_accent},fg=#ffffff"

# ── navigation (no prefix) ───────────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# ── windows & panes (prefix) ─────────────────────────────────────────────
bind c new-window -c "#{session_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r respawn-pane -k
bind R run-shell -b 'conf=$(tmux show-environment -g VIBE_TUI_CONF 2>/dev/null | cut -d= -f2-); [ -n "$conf" ] && tmux source-file "$conf" && tmux display-message "conf reloaded" || tmux display-message "VIBE_TUI_CONF unset"'

# ── mouse ────────────────────────────────────────────────────────────────
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},newwin}' 'new-window -c "#{session_path}"' 'select-window -t "{mouse}"'

# Sidebar clicks: handled by the SERVER (the pane's input stays off) — a
# click on a project row switches this client to that session, resolved
# through the row map the renderer publishes (@vibe_sidebar_map), so no
# second copy of the layout arithmetic exists to drift. `if -F -t =`
# expands against the MOUSE pane, not the active one. Every other pane
# gets tmux's stock MouseDown1Pane behavior verbatim (select + pass
# through).
bind -n MouseDown1Pane {
  if -F -t = "#{==:#{@vibe_role},sidebar}" {
    run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' click '#{pane_id}' '#{mouse_y}' '#{client_name}' 2>/dev/null || true"
  } {
    select-pane -t =
    send-keys -M
  }
}

# ── lifecycle (prefix) ───────────────────────────────────────────────────
bind Q confirm-before -p "quit vibe tui? agents keep running in their containers (y/n)" kill-session
bind K confirm-before -p "kill the whole vibe tui server? ALL projects' UI sessions end; agents keep running (y/n)" kill-server

# ── vibe integrations (prefix) ───────────────────────────────────────────
# prefix+v — clipboard image straight into the agent: clip-image.sh on
# the host, container path typed into the agent pane. (clip-to-pane.sh
# derives the session path from tmux — no path is interpolated into this
# shell string.)
bind v run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/clip-to-pane.sh' '#{@vibe_payload_dir}' '#{window_id}'"
# prefix+b — project sidebar, GLOBAL toggle: flips @vibe_sidebar_on for
# the whole UI (off kills every sidebar pane on the server; on re-grows
# them per window via the ensure hooks below).
bind b run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/sidebar.sh' toggle '#{window_id}'"
# prefix+t — toggle the bottom host dock (IDE-terminal style): grown on
# first use, then collapses to a 1-row strip / expands to the remembered
# height. Pure resize, shell state intact. Overrides tmux's default t
# (clock — unmissed).
bind t run-shell -b "bash '#{@vibe_payload_dir}/scripts/dock.sh' '#{window_id}' 2>/dev/null || true"
bind g display-popup -d "#{session_path}" -w 85% -h 85% -E "lazygit || bash -l"
bind o choose-tree -Zs
bind D display-popup -w 85% -h 70% -E "'#{@vibe_exe}' doctor; printf '\\n[enter to close] '; read _"
bind p display-popup -w 85% -h 70% -E "'#{@vibe_exe}' ps; printf '\\n[enter to close] '; read _"
bind u display-popup -w 85% -h 70% -E "'#{@vibe_exe}' request list; printf '\\n[enter to close] '; read _"

# ── the palette ──────────────────────────────────────────────────────────
bind Space display-menu -T " vibe " \
  "agent"             a "new-window -c \"#{session_path}\" -n agent \"'#{@vibe_exe}' agent\"" \
  "container shell"   s "new-window -c \"#{session_path}\" -n shell \"'#{@vibe_exe}' shell\"" \
  "attach main proc"  e "new-window -c \"#{session_path}\" -n attach \"'#{@vibe_exe}' attach\"" \
  "host shell"        h "new-window -c \"#{session_path}\"" \
  "" \
  "project sidebar"   b "run-shell -b \"bash '#{@vibe_payload_dir}/scripts/sidebar.sh' toggle '#{window_id}'\"" \
  "host dock"         t "run-shell -b \"bash '#{@vibe_payload_dir}/scripts/dock.sh' '#{window_id}'\"" \
  "clip image → agent" v "run-shell -b \"bash '#{@vibe_payload_dir}/scripts/clip-to-pane.sh' '#{@vibe_payload_dir}' '#{window_id}'\"" \
  "switch project"    o "choose-tree -Zs" \
  "git (lazygit)"     g "display-popup -d \"#{session_path}\" -w 85% -h 85% -E \"lazygit || bash -l\"" \
  "requests"          u "display-popup -w 85% -h 70% -E \"'#{@vibe_exe}' request list; printf '\\n[enter to close] '; read _\"" \
  "agents (vibe ps)"  p "display-popup -w 85% -h 70% -E \"'#{@vibe_exe}' ps; printf '\\n[enter to close] '; read _\"" \
  "doctor"            D "display-popup -w 85% -h 70% -E \"'#{@vibe_exe}' doctor; printf '\\n[enter to close] '; read _\"" \
  "" \
  "detach (keep running)" d "detach-client" \
  "quit ui"           Q "confirm-before -p \"quit vibe tui? agents keep running in their containers (y/n)\" kill-session" \
  "kill ui server (ALL)" K "confirm-before -p \"kill the whole vibe tui server? ALL projects' UI sessions end; agents keep running (y/n)\" kill-server"

# ── project sidebar ──────────────────────────────────────────────────────
# The fleet-glance, vertical: a far-left pane per window (sidebar.sh)
# with every project session's bold workspace name and git branch;
# click = switch. GLOBAL by design: one flag, on by default (-o so a
# prefix+R reload never overrides a live toggle), and the ensure hooks
# grow a sidebar into every window as it is created or visited.
set -goq @vibe_sidebar_on 1
set -goq @vibe_sidebar_w 30

# ── hooks ────────────────────────────────────────────────────────────────
# A dead agent pane here means the FRONTEND died (the docker-exec
# client) — the inner tmux session may well be alive. Mark it distinctly
# (◌) instead of trusting the last state: the forced-state arm of
# state-render.sh owns the guards (dead pane only, existing agent state
# only) and the glyph/color via theme.sh — one corpse semantics for
# tabs, borders, and roster.
set-hook -g pane-died {
  display-message "pane exited — prefix+r respawns it"
  run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/state-render.sh' '#{pane_id}' frontend-dead"
}

# ── agent-state title channel (docs/architecture.md (agent sessions)) ─────────────
# The container-side hook encodes state into the inner tmux session's
# title; it arrives here as a pane-title change through the docker-exec
# TTY. SECURITY: interpolate ONLY #{pane_id} (server-controlled) and the
# stamped @vibe_payload_dir (same trust domain — anyone who can set
# server options can already run-shell) — the title itself is
# container-controlled and is fetched out-of-band by state-render.sh,
# never expanded into shell words (spike-validated rule).
set-hook -g pane-title-changed {
  run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/state-render.sh' '#{pane_id}'"
}

# Every new session gets its host dock parked as the collapsed chrome
# bar (v1's tui.sh pre-built the layout; here the dock owns it).
set-hook -g session-created {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/dock.sh' ensure '#{window_id}' 2>/dev/null || true"
}

# Window resizes stretch panes proportionally; snap the sidebar back to
# its fixed width and a collapsed dock back to its 1-row bar (border
# drags don't resize the WINDOW, so manual resizes are never fought).
set-hook -g window-resized {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' fit '#{window_id}' 2>/dev/null || true"
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/dock.sh' fit '#{window_id}' 2>/dev/null || true"
}
set-hook -g after-new-window {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' ensure '#{window_id}' 2>/dev/null || true"
}
set-hook -g after-select-window {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' ensure '#{window_id}' 2>/dev/null || true"
}
set-hook -g client-session-changed {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' ensure '#{window_id}' 2>/dev/null || true"
}
