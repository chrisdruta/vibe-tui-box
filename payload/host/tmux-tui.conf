# vibe tui — the HOST-side tmux conf, ported from the v1 harness.
#
# Shipped in the engine payload (content-addressed, host-readable) and
# materialized by `vibe tui` into engine state with a stamped prologue:
# @vibe_exe (absolute engine binary) and VIBE_TUI_CONF (this file's
# materialized path, for prefix+R reload). Loaded with -f on a dedicated
# socket (tmux -L vibe-engine) so it never touches a personal
# ~/.tmux.conf or the default server. Conf applies at server start;
# passing -f on later calls is harmless.
#
# Requires tmux >= 3.4 (styles containing formats, user mouse ranges).
# The tray line (status-format[1], via @vibe_winlist) is the stock 3.7
# format plus the vibe cells; the stock construct lives as named
# constants in internal/payload/gen/render.go — on a tmux bump, diff
# those against `tmux show -g status-format` and regenerate.
#
# Host scripts (sidebar, dock, clip) live beside this conf in the
# payload at scripts/, reached through the stamped @vibe_payload_dir —
# the v2 successor of v1's @vibe_harness_dir rule: the host executes
# only store-owned bytes, never workspace files.
#
# The state-render.sh pane-title channel feeds the per-window
# @vibe_glyph/@vibe_dot_fg/@vibe_attn conditionals in the formats below
# (docs/architecture.md (agent sessions)); engine state lives in status-right via
# `vibe _state`.

# ── theme ────────────────────────────────────────────────────────────────
# User options so every style below reads one palette (the formats nest
# #{@thm_x} inside styles — the tmux >= 3.4 floor exists for this). The
# marker block is GENERATED from internal/tmuxui/theme.go: edit the Go
# source and run `go generate ./internal/payload`, never this block.
# >>> generated: theme
set -g @thm_bg      "#0e1421"
set -g @thm_surface "#1a2440"
set -g @thm_border  "#2a3554"
set -g @thm_fg      "#a9b6d8"
set -g @thm_bright  "#ffffff"
set -g @thm_dim     "#5c6b96"
set -g @thm_blue    "#7aa2f7"
set -g @thm_accent  "#3d59a1"
set -g @thm_coral   "#e8735a"
set -g @thm_green   "#9ece6a"
set -g @thm_yellow  "#e0af68"
set -g @thm_red     "#f7768e"
# <<< generated: theme

# ── prefix / session behavior ────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix
bind C-a send-prefix -2
set -g default-command "${SHELL}"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g allow-rename off
set -g detach-on-destroy on
# Error deaths stay visible: a pane whose command FAILS (an agent
# frontend losing its container, an engine error) becomes a corpse with
# its output readable and the pane-died hook's respawn hint firing —
# while clean exits (shell `exit`, a wrapped-up agent) still close
# their window. Plain `on` was rejected: it corpses every shell exit.
# The pane-died hook below carves out one corpse class: a nonzero death
# AFTER the agent's own run recorded its end (@vibe_state exited*)
# self-cleans instead of corpsing — explained deaths are not errors.
setw -g remain-on-exit failed

# ── terminal plumbing ────────────────────────────────────────────────────
set -s  default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
# Synchronized updates (DECSET 2026) toward the outer terminal —
# Windows Terminal and every modern emulator batch them; unsupported
# ones ignore the sequence. This is the LAST hop of the agent's
# flicker-free chain: the agent syncs to the inner tmux, the inner
# server (whose client is a pane here, TERM forwarded by the engine)
# syncs to us, and this declaration syncs us to the real screen.
set -as terminal-features ",xterm*:sync"
set -s  extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -s  escape-time 10
set -s  focus-events on
set -g  history-limit 50000
set -g  mouse on
set -s  set-clipboard on
set -g  allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# Everything under this server is the nested UI: panes inherit the
# marker, `vibe agent` forwards it into the container, and the inner
# tmux clients it stamps become reapable when the UI dies
# (agent-session.sh reap, run by `vibe tui` after a quit).
set-environment -g VIBE_NESTED 1
set -as terminal-features ",xterm*:title"
set -g  set-titles on
# The OS window title carries the project's display name (@vibe_name,
# stamped by `vibe tui`), never the ID-derived session name.
set -g  set-titles-string "🥡 #{?#{!=:#{@vibe_name},},#{@vibe_name},#S}"

# ── status bar ───────────────────────────────────────────────────────────
# The system tray (bottom, taskbar muscle memory): branding start
# button │ agent/window cells │ engine state + clock. Project identity
# lives in the SIDEBAR — the bar never repeats it, and the raw
# ID-derived session name appears nowhere. interval 5 (v1 used 0):
# engine state polls through #(vibe _state) in status-right, stamped
# per session by `vibe tui`.
set -g status 2
set -g status-position bottom
# Tabs sit in the TRUE middle of the bar (not just after the branding
# cell) — @vibe_winlist's align picks this up.
set -g status-justify absolute-centre
set -g status-interval 5
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 60
set -g window-status-separator " "
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
setw -g window-status-format "#{?#{@vibe_attn},#[fg=#{@thm_bg}#,bg=#{@thm_coral}#,bold],#[fg=#{@thm_dim}#,bg=#{@thm_surface}]}  #{?#{@vibe_glyph},#[fg=#{@vibe_dot_fg}]#{@vibe_glyph}#{?#{@vibe_attn},#[fg=#{@thm_bg}],#[fg=#{@thm_dim}]} ,}#W  "
setw -g window-status-current-format "#{?#{@vibe_attn},#[fg=#{@thm_bg}#,bg=#{@thm_coral}#,bold],#[fg=#{@thm_bright}#,bg=#{@thm_accent}#,bold]}  #{?#{@vibe_glyph},#[fg=#{@vibe_dot_fg}]#{@vibe_glyph}#{?#{@vibe_attn},#[fg=#{@thm_bg}],#[fg=#{@thm_bright}]} ,}#W  "
setw -g window-status-bell-style "fg=#{@thm_bg},bg=#{@thm_coral},bold"

# Ghost cells: container-side agent sessions with no window here, one
# click away in the tray (docs/tui-layout.md "Agent surfaces"). The
# value is a rendered format fragment — the sidebar's `vibe _frame`
# publishes it per SESSION from the same `vibe ps` fetch cache its
# nested rows read, so the tray and the sidebar can never disagree
# about what exists. The global default keeps a server with the sidebar
# off (its only publisher) rendering an empty roster, not a stale one.
set -goq @vibe_ghosts ""
# The tray middle lives in @vibe_winlist (the stock 3.7 window list, the
# ghost cells, and the clickable "+" cell) and @vibe_cheat (the
# prefix-held key hints);
# status-format[1] swaps between them on #{client_prefix} via #{E:} —
# option indirection keeps the giant W: construct out of the
# conditional's comma-parsing (styles there would all need #,-escapes).
# Cells deliberately avoid commas: one attribute per #[...] block.
# The winlist itself is GENERATED (internal/payload/gen/render.go),
# composed around tmux's stock W: construct held there as named
# constants — on a tmux bump, diff those constants against
# `tmux show -g status-format` instead of eyeballing this line.
# >>> generated: winlist
set -g @vibe_winlist "#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#[range=user|dock]#[fg=#{@thm_dim}] ▤ #[norange]#[default]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#{E:@vibe_ghosts} #[range=user|newwin]#[fg=#{@thm_dim}]#[bg=#{@thm_surface}] + #[norange]#[default]"
# <<< generated: winlist
set -g @vibe_cheat "#[align=centre]#[fg=#{@thm_yellow}] Space palette · c window · | − split · z zoom · [ scroll · f files · g git · b sidebar · t dock · v clip · o project · r respawn · x close · Q quit #[default]"
# Line 0 is the bar's top border: a dim rule separating the tray from
# pane content (the boundary the dock strip alone didn't provide).
# Generated at a fixed width; tmux clips the excess.
# >>> generated: bar-border
set -g status-format[0] "#[fg=#{@thm_border}]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"
# <<< generated: bar-border
set -g status-format[1] "#[align=left]#[range=user|brand] 🥡 #[fg=#{@thm_fg}]#[bold]vibe-tui-box #[norange]#[default]#{?client_prefix,#{E:@vibe_cheat},#{E:@vibe_winlist}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# status-right is stamped per session by `vibe tui`: the v1 prefix/copy
# indicators plus a clickable #(vibe _state) cell and the clock.

# ── canvas ───────────────────────────────────────────────────────────────
# Panes default to the palette bg, so the product renders on ITS canvas
# under every terminal scheme — the tabs' surface insets, the ghost
# cells' hairlines, and the sidebar's dim ramp are tuned against
# @thm_bg, not whatever bg the emulator happens to carry (2026-07-29
# polish pass: a purple host scheme left the chrome floating on a bg it
# was never mixed for). Foreground stays the terminal's — inner apps
# own their text; bg is the one attribute the chrome needs pinned.
# Popups get the same canvas plus fg (transient chrome like the menus,
# which already carry menu-style — the exec-failure hint text renders
# themed, and the apps inside paint over it). Light-scheme diehards
# override both in the user conf.
setw -g window-style "bg=#{@thm_bg}"
set -g popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# ── pane borders ─────────────────────────────────────────────────────────
setw -g pane-border-status top
setw -g pane-border-lines single
setw -g pane-border-style "fg=#{@thm_border}"
setw -g pane-active-border-style "fg=#{@thm_blue}"
setw -g pane-border-format "#[fg=#{@thm_border}]─#[default] #{?#{||:#{==:#{@vibe_role},agent},#{==:#{@vibe_role},}},#{?#{@vibe_glyph},#{?#{@vibe_attn},#[fg=#{@thm_coral}],#[fg=#{@vibe_dot_fg}]}#{@vibe_glyph}#[default] ,},}#{?pane_active,#[fg=#{@thm_blue}#,bold],#[fg=#{@thm_dim}]}#{?#{@vibe_title},#{@vibe_title},#{pane_title}}#[default] #[fg=#{@thm_border}]"

# ── popups / menus / messages ────────────────────────────────────────────
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@thm_blue}"
set -g menu-border-lines rounded
set -g menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g menu-selected-style "bg=#{@thm_accent},fg=#{@thm_bright},bold"
set -g message-style "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_surface},fg=#{@thm_yellow}"
set -g mode-style "bg=#{@thm_accent},fg=#{@thm_bright}"

# ── navigation (no prefix) ───────────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# ── windows & panes (prefix) ─────────────────────────────────────────────
bind c new-window -c "#{session_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r respawn-pane -k
bind R run-shell -b 'conf=$(tmux show-environment -g VIBE_TUI_CONF 2>/dev/null | cut -d= -f2-); [ -n "$conf" ] && tmux source-file "$conf" && tmux display-message "conf reloaded" || tmux display-message "VIBE_TUI_CONF unset"'

# ── mouse ────────────────────────────────────────────────────────────────
# Tray click dispatch by named range. ACTIONS fire on the press
# (MouseDown — tmux-native for tabs): the ▤ cell toggles the host dock
# (prefix+t as a button), the engine-state cell opens the request
# list, a ghost-N cell spawns its session's viewer (attach-only —
# agent-open.sh is the one definition the sidebar's viewer-less rows
# share; the range carries an INDEX into @vibe_ghost_map because tmux
# clips range names at 15 bytes, and a clipped session name once
# minted a junk session — tui-layout.md "Launch surfaces"), anything
# else is a window tab. MENUS fire on the RELEASE (MouseUp, below): a
# script-opened menu that appears while the button is still down is
# killed by that same click's release, so the two menu doors — 🥡
# palette and + agents chooser — wait for the click to complete. Their
# ranges no-op here so the press can't fall through to the window-tab
# arm.
bind -n MouseDown1Status {
  if -F '#{||:#{==:#{mouse_status_range},brand},#{==:#{mouse_status_range},newwin}}' {
  } {
    if -F '#{==:#{mouse_status_range},dock}' {
      run-shell -b "bash '#{@vibe_payload_dir}/scripts/dock.sh' '#{window_id}' 2>/dev/null || true"
    } {
      if -F '#{==:#{mouse_status_range},req}' {
        run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/popup.sh' '#{client_name}' '#{@vibe_exe}' request list"
      } {
        # The range is engine-rendered (ghostCells) and carries only a
        # digit index; agent-open.sh resolves it through the session's
        # @vibe_ghost_map and vets the resolved name itself.
        if -F '#{m:ghost-*,#{mouse_status_range}}' {
          run-shell -b "bash '#{@vibe_payload_dir}/scripts/agent-open.sh' '#{client_name}' '#{session_id}' -g '#{s/^ghost-//:mouse_status_range}'"
        } {
          select-window -t "{mouse}"
        }
      }
    }
  }
}
bind -n MouseUp1Status {
  if -F '#{==:#{mouse_status_range},brand}' {
    run-shell -b "bash '#{@vibe_payload_dir}/scripts/palette.sh' '#{client_name}'"
  } {
    if -F '#{==:#{mouse_status_range},newwin}' {
      run-shell -b "bash '#{@vibe_payload_dir}/scripts/chooser.sh' '#{client_name}'"
    }
  }
}

# Right-click — agent surgery on the bar (2026-07-28, tui-layout.md
# "Launch surfaces"): an agent viewer TAB or a tray GHOST CELL answers
# with the vibe menu (agent-menu.sh — stop the SESSION, not just the
# viewer; the stock menu's Kill only ever closed the window while the
# agent lived on in the roster). The vibe menu opens on the RELEASE
# (script menus born under a held button die on that click's release —
# the tray-door lesson), so the press arm only decides who owns the
# click: agent surfaces wait for the release, any other window tab
# gets a trimmed copy of the pinned tmux's stock window menu — the one
# default this bind costs (marked-pane items dropped; panes aren't
# this TUI's vocabulary).
# mouse_status_range carries only the range TYPE for window cells —
# the literal string "window", never the index (the manpage's exact
# words; a `window|*` match is dead code — the 2026-07-28 dogfood
# found every tab arm silent while ghosts worked, because USER ranges
# do report their bare argument). The clicked window itself rides
# exclusively in the {mouse} TARGET, so the release arm selects it
# first and then dispatches on the now-current window id — right-click
# focuses the tab it operates on, which the menu's title makes honest.
bind -n MouseDown3Status {
  if -F '#{==:#{mouse_status_range},window}' {
    if -F -t "{mouse}" '#{!=:#{@vibe_session},}' {
    } {
      display-menu -t "{mouse}" -T "#[align=centre]#{window_index}:#{window_name}" -x W -y W \
        "Swap Left" l "swap-window -d -t:-1" \
        "Swap Right" r "swap-window -d -t:+1" \
        "" \
        "Kill" X kill-window \
        "Respawn" R "respawn-window -k" \
        "Rename" n "command-prompt -I \"#W\" \"rename-window -- '%%'\""
    }
  }
}
bind -n MouseUp3Status {
  if -F '#{m:ghost-*,#{mouse_status_range}}' {
    run-shell -b "bash '#{@vibe_payload_dir}/scripts/agent-menu.sh' ghost '#{client_name}' '#{session_id}' '#{s/^ghost-//:mouse_status_range}' 2>/dev/null || true"
  } {
    if -F '#{==:#{mouse_status_range},window}' {
      select-window -t "{mouse}"
      run-shell -b "bash '#{@vibe_payload_dir}/scripts/agent-menu.sh' tab '#{client_name}' '#{session_id}' '#{window_id}' 2>/dev/null || true"
    }
  }
}

# Right-click on PANES: the sidebar joins the agent-surgery vocabulary
# (agent-menu.sh row mode resolves the row through @vibe_sidebar_map —
# 2026-07-28, Chris, superseding "sidebar rows stay render-only": the
# rows were already left-clickable, and the menu is where the dead
# rows' dismiss gesture lives). Everything else keeps stock-ish
# behavior: apps that asked for the mouse get the event (the inner
# tmux and its agent TUIs), other panes a trimmed copy of the pinned
# tmux's stock pane menu — claiming the bind costs the default, the
# Status arm's recorded trade. The release forwards to mouse apps too,
# or their menus would see a press with no release.
bind -n MouseDown3Pane {
  if -F -t = "#{==:#{@vibe_role},sidebar}" {
  } {
    if -F -t = "#{||:#{mouse_any_flag},#{pane_in_mode}}" {
      select-pane -t =
      send-keys -M
    } {
      display-menu -t = -x M -y M -T "#[align=centre]#{pane_index} (#{pane_id})" \
        "Respawn" R "respawn-pane -k" \
        "Kill" X kill-pane \
        "" \
        "Swap Up" u "swap-pane -U" \
        "Swap Down" d "swap-pane -D"
    }
  }
}
bind -n MouseUp3Pane {
  if -F -t = "#{==:#{@vibe_role},sidebar}" {
    run-shell -b "bash '#{@vibe_payload_dir}/scripts/agent-menu.sh' row '#{client_name}' '#{pane_id}' '#{mouse_y}' 2>/dev/null || true"
  } {
    if -F -t = "#{mouse_any_flag}" {
      send-keys -M -t =
    }
  }
}

# Sidebar clicks: handled by the SERVER (the pane's input stays off) — a
# click on a project row switches this client to that session, resolved
# through the row map the renderer publishes (@vibe_sidebar_map), so no
# second copy of the layout arithmetic exists to drift. `if -F -t =`
# expands against the MOUSE pane, not the active one. Every other pane
# gets tmux's stock MouseDown1Pane behavior verbatim (select + pass
# through).
bind -n MouseDown1Pane {
  if -F -t = "#{==:#{@vibe_role},sidebar}" {
    run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' click '#{pane_id}' '#{mouse_y}' '#{client_name}' 2>/dev/null || true"
  } {
    if -F -t = "#{&&:#{==:#{@vibe_role},host},#{==:#{@vibe_dock_min},1}}" {
      # Clicking the COLLAPSED dock strip expands it (taskbar feel) —
      # selecting a 1-row pane was a dead end. Expanded, clicks type
      # into the shell normally.
      run-shell -b "bash '#{@vibe_payload_dir}/scripts/dock.sh' '#{window_id}' 2>/dev/null || true"
    } {
      select-pane -t =
      send-keys -M
    }
  }
}

# Ctrl+click — follow the path under the pointer. open-path.sh reads
# the clicked line back via capture-pane (NOT #{mouse_word}: the
# default word-separators split on ./:- so a path arrives as
# fragments, and passing #{q:mouse_line} through run-shell inserts
# escape backslashes that shift the column arithmetic), extracts a
# path around the mouse column, resolves it inside the project's
# container over `vibe exec`, and routes it: text files → the review
# stack's nvim popup (review.sh `file` mode), images → the reusable
# preview window (show-image.sh — sixel, or loud low-fi). Nothing
# path-shaped under the pointer is a silent no-op, so the gesture
# stays free over prose. This claims ctrl+click at the host layer for
# EVERY pane — the inner servers never see it; a host-owned gesture,
# not a chain-parity feature.
bind -n C-MouseDown1Pane run-shell -b "bash '#{@vibe_payload_dir}/scripts/open-path.sh' '#{client_name}' '#{session_path}' '#{@vibe_exe}' '#{pane_id}' '#{mouse_x}' '#{mouse_y}' 2>/dev/null || true"

# ── lifecycle (prefix) ───────────────────────────────────────────────────
# The confirm prompts live once, as command aliases, so the binds here
# and the palette's quit/kill items cannot drift apart.
set -sa command-alias "vibe-quit-ui=confirm-before -p \"quit vibe tui? agents & containers keep running — palette: park project (y/n)\" kill-session"
set -sa command-alias "vibe-kill-server=confirm-before -p \"kill the whole vibe tui server? ALL projects' UI sessions end; agents keep running — 'vibe agent --stop' ends one (y/n)\" kill-server"
bind Q vibe-quit-ui
bind K vibe-kill-server

# ── vibe integrations (prefix) ───────────────────────────────────────────
# prefix+v — clipboard image straight into the agent: `vibe clip` on
# the host, container path typed into the agent pane. (clip-to-pane.sh
# derives the session path from tmux — no path is interpolated into this
# shell string.)
bind v run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/clip-to-pane.sh' '#{window_id}'"
# prefix+b — project sidebar, GLOBAL toggle: flips @vibe_sidebar_on for
# the whole UI (off kills every sidebar pane on the server; on re-grows
# them per window via the ensure hooks below).
bind b run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/sidebar.sh' toggle '#{window_id}'"
# prefix+t — toggle the bottom host dock (IDE-terminal style): grown on
# first use, then collapses to a 1-row strip / expands to the remembered
# height. Pure resize, shell state intact. Overrides tmux's default t
# (clock — unmissed).
bind t run-shell -b "bash '#{@vibe_payload_dir}/scripts/dock.sh' '#{window_id}' 2>/dev/null || true"
# prefix+f/g — the review stack (docs/tui-layout.md "Editor
# surfaces"): files (nvim + oil) and git/diff review (lazygit), both
# image-baked in the CONTAINER and reached over `vibe exec` — a cold
# host needs nothing installed. review.sh is the one router serving
# these binds and the palette items. (prefix+G — diffview — was
# retired by dogfood the same day it shipped: lazygit owns diffs.)
bind f run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/review.sh' '#{client_name}' '#{@vibe_exe}' '#{session_path}' files"
bind g run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/review.sh' '#{client_name}' '#{@vibe_exe}' '#{session_path}' git"
bind o choose-tree -Zs
# Engine popups ride run-shell → popup.sh, never display-popup
# directly: display-popup does not format-expand its shell-command, so
# a direct binding would hand bash the literal '#{@vibe_exe}'
# (run-shell expands; the option-shaped args like -d/-T still do).
bind D run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/popup.sh' '#{client_name}' '#{@vibe_exe}' doctor"
bind p run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/popup.sh' '#{client_name}' '#{@vibe_exe}' ps"
bind u run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/popup.sh' '#{client_name}' '#{@vibe_exe}' request list"

# ── the palette ──────────────────────────────────────────────────────────
# One definition in palette.sh serving both doors: this bind and the
# tray's 🥡 / + cells (mouse dispatch above).
bind Space run-shell -b "bash '#{@vibe_payload_dir}/scripts/palette.sh' '#{client_name}'"

# ── project sidebar ──────────────────────────────────────────────────────
# The fleet-glance, vertical: a far-left pane per window (sidebar.sh)
# with every project session's bold workspace name and git branch;
# click = switch. GLOBAL by design: one flag, on by default (-o so a
# prefix+R reload never overrides a live toggle), and the ensure hooks
# grow a sidebar into every window as it is created or visited.
set -goq @vibe_sidebar_on 1
set -goq @vibe_sidebar_w 30
# Expanded host-dock height (rows or NN%); consumed by dock.sh.
set -goq @vibe_dock_size "30%"
# Unprompted engine-truth refetch cadence for the sidebar, in seconds
# (@vibe_engine_serial bumps refresh sooner; docs/tui-layout.md).
set -goq @vibe_engine_refresh 30

# ── hooks ────────────────────────────────────────────────────────────────
# Two corpse fates, split on the pane's recorded agent state. exited*
# means the RUN'S OWN END was recorded (the container-side exit trap
# fired) before the frontend died — the death is explained, there is
# nothing left to diagnose, and the viewer would otherwise linger as a
# ✗ window the user must reap by hand (agent exit codes never cross
# the inner-tmux client boundary, so a quit can still land here through
# a nonzero conduit exit): self-clean. Any other state means the
# FRONTEND died out from under a possibly-live agent (the docker-exec
# client) — mark it distinctly (◌) instead of trusting the last state:
# the forced-state arm of state-render.sh owns the guards (dead pane
# only, existing agent state only) and the glyph/color via theme.sh —
# one corpse semantics for tabs, borders, and roster.
set-hook -g pane-died {
  if-shell -F "#{m:exited*,#{@vibe_state}}" {
    kill-pane
  } {
    display-message "pane exited — prefix+r respawns · prefix+x closes"
    run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/state-render.sh' '#{pane_id}' frontend-dead"
  }
}

# ── agent-state title channel (docs/architecture.md (agent sessions)) ─────────────
# The container-side hook encodes state into the inner tmux session's
# title; it arrives here as a pane-title change through the docker-exec
# TTY. SECURITY: interpolate ONLY #{pane_id} (server-controlled) and the
# stamped @vibe_payload_dir (same trust domain — anyone who can set
# server options can already run-shell) — the title itself is
# container-controlled and is fetched out-of-band by state-render.sh,
# never expanded into shell words (spike-validated rule).
set-hook -g pane-title-changed {
  run-shell -b "exec bash '#{@vibe_payload_dir}/scripts/state-render.sh' '#{pane_id}'"
}

# Every new session gets its host dock parked as the collapsed chrome
# bar (v1's tui.sh pre-built the layout; here the dock owns it).
set-hook -g session-created {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/dock.sh' ensure '#{window_id}' 2>/dev/null || true"
}

# Window resizes stretch panes proportionally; snap the sidebar back to
# its fixed width and a collapsed dock back to its 1-row bar (border
# drags don't resize the WINDOW, so manual resizes are never fought).
set-hook -g window-resized {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' fit '#{window_id}' 2>/dev/null || true"
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/dock.sh' fit '#{window_id}' 2>/dev/null || true"
}
set-hook -g after-new-window {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' ensure '#{window_id}' 2>/dev/null || true"
}
set-hook -g after-select-window {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' ensure '#{window_id}' 2>/dev/null || true"
}
set-hook -g client-session-changed {
  run-shell -b "bash '#{@vibe_payload_dir}/scripts/sidebar.sh' ensure '#{window_id}' 2>/dev/null || true"
}
