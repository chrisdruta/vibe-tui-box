name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt (no diffs)
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: payload manifest drift
        # payload/manifest.json is generated but tracked (it carries the
        # file modes go:embed drops); editing payload/** without
        # regenerating it must fail here.
        run: |
          go generate ./internal/payload
          git diff --exit-code payload/
      - name: ShellCheck (payload, both sides)
        # Host scripts must additionally stay bash-3.2-clean (stock
        # macOS) — ShellCheck can't version-gate that, so bashisms past
        # 3.2 are a review concern; this still catches the usual classes.
        run: shellcheck payload/container/*.sh payload/host/scripts/*.sh
      # Default output collides with the gitignored dev-build name at the
      # repo root — always build with -o (see AGENTS.md).
      - run: go build -o bin/vibe ./cmd/vibe && bin/vibe version
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  cross-compile:
    # The release matrix must always build (AGENTS.md); CGO stays off so
    # artifacts are static.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"

  docker-integration:
    # The one place SDK translation meets a real daemon
    # (internal/dockerapi's TestSDK* tests self-skip without one; the
    # ubuntu runner has one).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -v -run TestSDK ./internal/dockerapi/

  fuzz:
    # Short bursts over every hostile-input surface. Found crashers land
    # in testdata/fuzz/ and become permanent regression seeds — commit
    # them.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz every target briefly
        run: |
          set -eu
          while read -r target pkg; do
            echo "== $target $pkg"
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s "$pkg"
          done <<'EOF'
          FuzzLoad ./internal/schema/
          FuzzParse ./internal/envfile/
          FuzzParsers ./internal/domain/
          FuzzParseRequest ./internal/broker/
          FuzzEncode ./internal/terminal/
          FuzzDiff ./internal/terminal/
          EOF
