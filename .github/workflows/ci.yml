name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here publishes; every job only reads the checkout, so the
# default write-capable GITHUB_TOKEN scope would just be pinned-action
# blast radius.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt (no diffs)
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: payload manifest drift
        # payload/manifest.json is generated but tracked (it carries the
        # file modes go:embed drops); editing payload/** without
        # regenerating it must fail here. Porcelain, not diff: the
        # generator writes whole standalone files, and an untracked one
        # is invisible to `git diff` — a binary built from that tree
        # would fail payload verification at runtime.
        run: |
          go generate ./internal/payload
          test -z "$(git status --porcelain payload/)"
      - name: ShellCheck (payload, both sides)
        # Host scripts must additionally stay bash-3.2-clean (stock
        # macOS) — ShellCheck can't version-gate that, so bashisms past
        # 3.2 are a review concern; this still catches the usual classes.
        # The preset hook .sample files ship into every new project via
        # `vibe init`, so they are linted too (bash shebangs pick the
        # dialect despite the extension).
        run: shellcheck payload/container/*.sh payload/host/scripts/*.sh payload/presets/*/hooks/*.sample
      # Default output collides with the gitignored dev-build name at the
      # repo root — always build with -o (see AGENTS.md).
      - run: go build -o bin/vibe ./cmd/vibe && bin/vibe version
      # -race: watchStream's goroutines, the tmuxui tick loops, and the
      # lock/lease machinery deserve the detector, and the suite is
      # fast enough to afford it.
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  cross-compile:
    # The release matrix must always build (AGENTS.md); CGO stays off so
    # artifacts are static.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"

  docker-integration:
    # The one place SDK translation meets a real daemon
    # (internal/dockerapi's TestSDK* tests self-skip without one; the
    # ubuntu runner has one).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -v -run TestSDK ./internal/dockerapi/

  fuzz:
    # Short bursts over every hostile-input surface. Found crashers land
    # in testdata/fuzz/ and become permanent regression seeds — commit
    # them (the artifact upload below preserves them past the runner).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz every target briefly
        run: |
          set -eu
          while read -r target pkg; do
            echo "== $target $pkg"
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s "$pkg"
          done <<'EOF'
          FuzzLoad ./internal/schema/
          FuzzParse ./internal/envfile/
          FuzzParsers ./internal/domain/
          FuzzParseRequest ./internal/broker/
          FuzzEncode ./internal/terminal/
          FuzzLine ./internal/terminal/
          FuzzDiff ./internal/terminal/
          EOF
      - name: preserve found crashers
        # A crasher on an ephemeral runner is otherwise lost with it —
        # the failure log doesn't reliably contain the input bytes.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crashers
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore
